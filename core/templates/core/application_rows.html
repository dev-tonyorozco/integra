<div class="application-list">{% for app in applications %}<a class="application-row" href="{% url 'application' app.pk %}"><div><small class="folio">{{ app.folio }}</small><strong>{{ app.person.name }}</strong><small>{{ app.opportunity }}</small></div><div><span class="pill">{{ app.state_label }}</span><small>{{ app.responsible }}</small></div><div><span class="status {% if app.sla == 'Vencida' %}danger{% endif %}">{{ app.sla }}</span><small>{{ app.due_at|date:'d M · H:i' }}</small><small>{{ app.next_action }}</small></div></a>{% empty %}<div class="empty"><h3>Todo listo para comenzar</h3><p>Las solicitudes que recibas aparecerán aquí.</p></div>{% endfor %}</div>
