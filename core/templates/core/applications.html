{% extends 'core/base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">ACOMPAÑAMIENTO</p><h1>Solicitudes</h1><p class="muted">Personas, responsables y siguientes pasos.</p></div><a class="button secondary" href="{% url 'reports' %}?export=csv">Exportar CSV</a></div><form class="filters" method="get"><input aria-label="Buscar solicitudes" name="q" placeholder="Nombre, folio o correo" value="{{ q }}"><select name="ministry" aria-label="Ministerio"><option value="">Todos los ministerios</option>{% for m in ministries %}<option value="{{ m.pk }}" {% if request.GET.ministry == m.pk|stringformat:'s' %}selected{% endif %}>{{ m }}</option>{% endfor %}</select><label class="inline"><input type="checkbox" name="mine" value="1" {% if request.GET.mine %}checked{% endif %}> Mi bandeja</label><label class="inline"><input type="checkbox" name="overdue" value="1" {% if request.GET.overdue %}checked{% endif %}> Vencidas</label><button>Filtrar</button><a href="{% url 'applications' %}">Limpiar</a></form><section class="card">{% include 'core/application_rows.html' with applications=page %}</section>{% include 'core/pagination.html' %}{% endblock %}
