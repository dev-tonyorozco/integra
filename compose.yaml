services:
  app:
    build: .
    ports: ["127.0.0.1:8080:80"]
    env_file: .env
    environment:
      DB_DATABASE: /var/www/html/storage/app/private/integra.sqlite
    volumes: ["integra-storage:/var/www/html/storage"]
    restart: unless-stopped
  scheduler:
    build: .
    profiles: ["scheduler"]
    env_file: .env
    environment:
      DB_DATABASE: /var/www/html/storage/app/private/integra.sqlite
    command: ["php", "artisan", "schedule:work"]
    volumes: ["integra-storage:/var/www/html/storage"]
    restart: unless-stopped
volumes:
  integra-storage:
