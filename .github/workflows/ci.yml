name: Validación manual INTEGRA
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: integra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'integra_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: local-test-only
      DB_SCHEMA: integra
      DB_SSLMODE: disable
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, dom, zip
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - if: matrix.database == 'pgsql'
        run: php artisan integra:database-prepare
      - run: php vendor/bin/phpunit
      - run: php artisan view:cache && php artisan route:cache
